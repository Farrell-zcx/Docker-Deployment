# =====================================================
# Nginx Reverse Proxy Configuration
# =====================================================
# Semua request masuk via Nginx (port 80), lalu diarahkan
# ke container yang sesuai berdasarkan domain/subdomain.
# =====================================================

# SSO Engine — sso.localhost (atau sso.domain.com di production)
server {
    listen 80;
    server_name sso.localhost sso.domain.com;

    location / {
        proxy_pass http://sso-engine:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# MyMember — mymember.localhost (atau mymember.domain.com di production)
server {
    listen 80;
    server_name mymember.localhost mymember.domain.com;

    # Request utama → MyMember PHP Backend
    location / {
        proxy_pass http://mymember-app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload KTP bisa besar, naikkan limit
        client_max_body_size 10M;
    }

    # Request OCR → FastAPI Microservice
    # Akses via: mymember.localhost/ocr/extract-ktp
    location /ocr/ {
        rewrite ^/ocr/(.*) /$1 break;
        proxy_pass http://mymember-ocr:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload gambar KTP
        client_max_body_size 10M;
    }
}

# Default — fallback jika domain tidak cocok
server {
    listen 80 default_server;
    server_name _;

    location / {
        return 404 '{"error": "Domain tidak dikenali. Gunakan sso.localhost atau mymember.localhost"}';
        add_header Content-Type application/json;
    }
}
