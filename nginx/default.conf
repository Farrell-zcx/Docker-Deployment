# =====================================================
# Nginx Reverse Proxy Configuration (Production HTTPS)
# =====================================================

# =====================================================
# SSO ENGINE (HTTPS)
# =====================================================
server {
    listen 80;
    listen 443 ssl;
    server_name sso.31.97.48.33.sslip.io sso.localhost;

    ssl_certificate /etc/letsencrypt/live/mymember.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mymember.tech/privkey.pem;

    location / {
        proxy_pass http://sso-engine:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# =====================================================
# MYMEMBER (HTTPS)
# =====================================================
server {
    listen 80;
    listen 443 ssl;
    server_name mymember.tech www.mymember.tech mymember.31.97.48.33.sslip.io mymember.localhost;

    ssl_certificate /etc/letsencrypt/live/mymember.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mymember.tech/privkey.pem;

    location / {
        proxy_pass http://mymember-app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 10M;
    }

    location = /ocr/docs {
        proxy_pass http://mymember-ocr:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ocr-api/ {
        rewrite ^/ocr-api/(.*) /$1 break;
        proxy_pass http://mymember-ocr:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 10M;
    }

    location = /openapi.json {
        proxy_pass http://mymember-ocr:8000/openapi.json;
        proxy_set_header Host $host;
    }
}

# =====================================================
# WEB INVENTORY (HTTPS)
# =====================================================
server {
    listen 80;
    listen 443 ssl;
    server_name inventory.31.97.48.33.sslip.io inventory.localhost;

    ssl_certificate /etc/letsencrypt/live/mymember.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mymember.tech/privkey.pem;

    location / {
        proxy_pass http://inventory-app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 20M;
    }
}

# Default Fallback
server {
    listen 80 default_server;
    server_name _;

    location / {
        return 404 '{"error": "Domain tidak dikenali"}';
        add_header Content-Type application/json;
    }
}
